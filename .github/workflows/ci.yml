name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.placeprepai.fun/api
      - name: No secrets in the bundle
        run: |
          if grep -rEn "rzp_(live|test)_[A-Za-z0-9]{8,}|sk_live_|-----BEGIN" dist src; then
            echo "Credential-shaped string found"; exit 1; fi
